name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build pinned toolchain image
        run: docker build --tag ethers-rpc-pool-quality .

      - name: Run hermetic quality gate
        run: >-
          docker run --rm --network none
          --volume "${{ github.workspace }}:/workspace"
          --volume /workspace/node_modules
          ethers-rpc-pool-quality

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true

  release:
    name: Release
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up exact Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Set up and verify exact npm version
        run: |
          npm install --global npm@11.19.1
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "11.19.1"

      - name: Install locked dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish release
        run: npm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
